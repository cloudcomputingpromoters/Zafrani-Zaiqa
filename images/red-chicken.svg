<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Rich red-to-maroon gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6B0F0F"/>
      <stop offset="45%"  stop-color="#8B1A1A"/>
      <stop offset="100%" stop-color="#C8320A"/>
    </linearGradient>
    <!-- Warm glow for the plate -->
    <radialGradient id="plateGlow" cx="50%" cy="55%" r="38%">
      <stop offset="0%"   stop-color="#E8502A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#D6CFC7"/>
    </radialGradient>
    <!-- Gold shimmer for text accent -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E8C97A"/>
      <stop offset="50%"  stop-color="#F5DFA0"/>
      <stop offset="100%" stop-color="#C8A640"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3B0000" flood-opacity="0.55"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3B0000" flood-opacity="0.7"/>
    </filter>
    <filter id="leafShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A0000" flood-opacity="0.4"/>
    </filter>
    <!-- Spice pattern -->
    <pattern id="spicePattern" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(30)">
      <circle cx="5"  cy="5"  r="1.2" fill="rgba(255,255,255,0.04)"/>
      <circle cx="25" cy="15" r="0.9" fill="rgba(255,255,255,0.03)"/>
      <circle cx="10" cy="30" r="1.5" fill="rgba(255,255,255,0.035)"/>
      <circle cx="35" cy="35" r="1"   fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <!-- Subtle spice texture -->
  <rect width="600" height="400" fill="url(#spicePattern)"/>
  <!-- Warm centre glow -->
  <ellipse cx="300" cy="230" rx="280" ry="200" fill="url(#plateGlow)"/>

  <!-- Decorative corner flames/sparks (top-left) -->
  <g opacity="0.18">
    <ellipse cx="30" cy="30" rx="50" ry="25" fill="#FF6030" transform="rotate(-30,30,30)"/>
    <ellipse cx="10" cy="60" rx="30" ry="12" fill="#FF8040" transform="rotate(-15,10,60)"/>
  </g>
  <!-- Decorative corner (bottom-right) -->
  <g opacity="0.15">
    <ellipse cx="570" cy="370" rx="55" ry="28" fill="#FF5020" transform="rotate(25,570,370)"/>
    <ellipse cx="590" cy="340" rx="32" ry="14" fill="#FF7030" transform="rotate(10,590,340)"/>
  </g>

  <!-- Plate / serving dish -->
  <ellipse cx="300" cy="248" rx="195" ry="30" fill="rgba(0,0,0,0.25)" filter="url(#shadow)"/>
  <ellipse cx="300" cy="232" rx="192" ry="118" fill="url(#plateGrad)" filter="url(#shadow)"/>
  <!-- Plate rim highlight -->
  <ellipse cx="300" cy="232" rx="192" ry="118" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <!-- Plate inner ring -->
  <ellipse cx="300" cy="232" rx="174" ry="108" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="1.5"/>

  <!-- Chicken pieces on the plate -->
  <!-- Piece 1 (left back) -->
  <g opacity="0.92">
    <ellipse cx="224" cy="225" rx="52" ry="38" fill="#8B2A00" filter="url(#shadow)"/>
    <ellipse cx="224" cy="225" rx="52" ry="38" fill="none" stroke="#C84020" stroke-width="2" opacity="0.5"/>
    <!-- Spice coating highlight -->
    <ellipse cx="218" cy="218" rx="28" ry="18" fill="#C84020" opacity="0.5"/>
    <ellipse cx="213" cy="213" rx="14" ry="9"  fill="#E86030" opacity="0.4"/>
    <!-- Grill marks -->
    <line x1="208" y1="218" x2="240" y2="234" stroke="#5A1500" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="204" y1="226" x2="236" y2="238" stroke="#5A1500" stroke-width="2"   stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Piece 2 (right back) -->
  <g opacity="0.92">
    <ellipse cx="376" cy="220" rx="55" ry="40" fill="#901E00" filter="url(#shadow)"/>
    <ellipse cx="376" cy="220" rx="55" ry="40" fill="none" stroke="#D04525" stroke-width="2" opacity="0.5"/>
    <ellipse cx="370" cy="212" rx="30" ry="20" fill="#D04525" opacity="0.45"/>
    <ellipse cx="365" cy="207" rx="15" ry="10" fill="#E86535" opacity="0.4"/>
    <line x1="358" y1="213" x2="392" y2="228" stroke="#5A1200" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="354" y1="221" x2="388" y2="233" stroke="#5A1200" stroke-width="2"   stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Piece 3 (front center — largest, hero piece) -->
  <g opacity="0.97">
    <ellipse cx="300" cy="248" rx="68" ry="50" fill="#7A1800" filter="url(#shadow)"/>
    <!-- Rich red masala coating -->
    <ellipse cx="300" cy="248" rx="68" ry="50" fill="url(#bgGrad)" opacity="0.6"/>
    <ellipse cx="300" cy="248" rx="68" ry="50" fill="none" stroke="#C83020" stroke-width="2.5" opacity="0.55"/>
    <!-- Shiny highlight (fresh out of tandoor) -->
    <ellipse cx="287" cy="236" rx="36" ry="24" fill="#E05030" opacity="0.5"/>
    <ellipse cx="280" cy="229" rx="18" ry="11" fill="#F07040" opacity="0.45"/>
    <ellipse cx="275" cy="225" rx="8"  ry="5"  fill="rgba(255,255,255,0.18)"/>
    <!-- Grill marks -->
    <line x1="270" y1="240" x2="330" y2="258" stroke="#4A1000" stroke-width="3"   stroke-linecap="round" opacity="0.55"/>
    <line x1="264" y1="250" x2="328" y2="264" stroke="#4A1000" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="270" y1="259" x2="330" y2="270" stroke="#4A1000" stroke-width="2"   stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Red masala sauce pool on plate -->
  <ellipse cx="300" cy="290" rx="150" ry="22" fill="#C82A08" opacity="0.28"/>
  <ellipse cx="270" cy="288" rx="50"  ry="10" fill="#E03010" opacity="0.18"/>

  <!-- Fresh curry leaves garnish -->
  <g filter="url(#leafShadow)">
    <!-- Leaf 1 -->
    <ellipse cx="178" cy="268" rx="18" ry="7" fill="#2A6B1A" transform="rotate(-20,178,268)"/>
    <line x1="164" y1="266" x2="193" y2="270" stroke="#1A4A10" stroke-width="1" opacity="0.7" transform="rotate(-20,178,268)"/>
    <!-- Leaf 2 -->
    <ellipse cx="190" cy="279" rx="16" ry="6" fill="#338020" transform="rotate(-35,190,279)"/>
    <line x1="178" y1="278" x2="202" y2="280" stroke="#1A4A10" stroke-width="1" opacity="0.7" transform="rotate(-35,190,279)"/>
    <!-- Leaf 3 -->
    <ellipse cx="412" cy="262" rx="17" ry="6" fill="#2A6B1A" transform="rotate(15,412,262)"/>
    <line x1="397" y1="262" x2="424" y2="262" stroke="#1A4A10" stroke-width="1" opacity="0.7" transform="rotate(15,412,262)"/>
    <!-- Leaf 4 -->
    <ellipse cx="422" cy="274" rx="14" ry="5.5" fill="#338020" transform="rotate(30,422,274)"/>
    <line x1="410" y1="274" x2="434" y2="274" stroke="#1A4A10" stroke-width="1" opacity="0.7" transform="rotate(30,422,274)"/>
  </g>

  <!-- Lemon wedge accent -->
  <g opacity="0.9">
    <path d="M346 283 Q358 268 370 283 Z" fill="#E8C030" opacity="0.85"/>
    <path d="M346 283 Q358 298 370 283 Z" fill="#F0D040" opacity="0.75"/>
    <line x1="358" y1="268" x2="358" y2="298" stroke="#C8A820" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Scattered red chili flakes & spice dots on plate -->
  <circle cx="248" cy="278" r="3"   fill="#C83020" opacity="0.55"/>
  <circle cx="258" cy="285" r="2"   fill="#E04030" opacity="0.45"/>
  <circle cx="352" cy="276" r="2.5" fill="#C83020" opacity="0.5"/>
  <circle cx="340" cy="284" r="1.8" fill="#D04535" opacity="0.45"/>
  <circle cx="220" cy="260" r="2.2" fill="#A82010" opacity="0.4"/>
  <circle cx="388" cy="270" r="2"   fill="#C83020" opacity="0.4"/>

  <!-- Decorative top border line -->
  <rect x="0" y="0" width="600" height="4" fill="url(#goldText)" opacity="0.6"/>

  <!-- Title text -->
  <text x="300" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold"
        fill="url(#goldText)" text-anchor="middle" filter="url(#textShadow)" letter-spacing="2">
    Red Chicken
  </text>

  <!-- Subtitle -->
  <text x="300" y="82" font-family="Georgia, serif" font-size="13" font-style="italic"
        fill="rgba(255,255,255,0.70)" text-anchor="middle" letter-spacing="1.5">
    Spiced · Marinated · Slow-Cooked
  </text>

  <!-- Small decorative divider under title -->
  <line x1="240" y1="95" x2="360" y2="95" stroke="url(#goldText)" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="95" r="3" fill="#E8C97A" opacity="0.7"/>

  <!-- Bottom label bar -->
  <rect x="0" y="360" width="600" height="40" fill="rgba(0,0,0,0.35)"/>
  <text x="300" y="386" font-family="Georgia, serif" font-size="12" font-weight="bold"
        fill="rgba(232,201,122,0.9)" text-anchor="middle" letter-spacing="3" text-transform="uppercase">
    ZAFRANI ZAIQA · AUTHENTIC HYDERABADI
  </text>
</svg>
